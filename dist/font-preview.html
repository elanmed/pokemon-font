<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html {
        padding: 12px;
      }
      #glyphContainer {
        display: flex;
        flex-wrap: wrap;
        gap: 48px;
      }
      #glyphContainer span {
        font-size: 48px;
      }
    </style>
  </head>
  <body>
    <div id="glyphContainer"></div>
    <script>
      async function main() {
        const configResponse = await fetch("preview-config.json");
        const config = await configResponse.json();

        const previewFont = new FontFace(
          config.fontFamily,
          `url("${config.fontFamily}.ttf")`,
        );
        await previewFont.load();
        document.fonts.add(previewFont);

        const glyphContainerElement = document.getElementById("glyphContainer");
        glyphContainerElement.style.fontFamily = `"${config.fontFamily}", sans-serif`;

        const sampleElement = document.createElement("span");
        sampleElement.textContent = "aA";
        glyphContainerElement.appendChild(sampleElement);

        renderStaticGlyphs(glyphContainerElement, config);

        if (config.animated) {
          renderAnimatedGlyphs(glyphContainerElement, config);
        }
      }

      function renderStaticGlyphs(glyphContainerElement, config) {
        for (
          let glyphIndex = 0;
          glyphIndex < config.totalStaticGlyphCount;
          glyphIndex++
        ) {
          const character = String.fromCodePoint(
            config.privateUseAreaStart + glyphIndex,
          );
          const glyphElement = document.createElement("span");
          glyphElement.textContent = character;
          glyphContainerElement.appendChild(glyphElement);
        }
      }

      function renderAnimatedGlyphs(glyphContainerElement, config) {
        const frameIntervalMs = 100;
        let pokemonFrameOffset = config.animatedFrameStartOffset;
        for (const frameCount of config.frameCounts) {
          const glyphElement = document.createElement("span");
          const glyphFrameOffset = pokemonFrameOffset;
          let currentFrameIndex = 0;
          glyphElement.textContent = String.fromCodePoint(
            config.privateUseAreaStart + glyphFrameOffset,
          );
          setInterval(() => {
            currentFrameIndex = (currentFrameIndex + 1) % frameCount;
            glyphElement.textContent = String.fromCodePoint(
              config.privateUseAreaStart + glyphFrameOffset + currentFrameIndex,
            );
          }, frameIntervalMs);
          glyphContainerElement.appendChild(glyphElement);
          pokemonFrameOffset += frameCount;
        }
      }

      main();
    </script>
  </body>
</html>
